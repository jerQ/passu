# Build the release firmware and the passu host command when a version tag
# is pushed, and create a draft GitHub release with them. Review the draft,
# then publish it.
#
#   git tag v0.1.2 && git push origin v0.1.2
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    # Same ESP-IDF version as the documented local setup (BUILDING.md)
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags, for the firmware version string

      - name: Build release images
        shell: bash
        run: |
          # the checkout is owned by another user inside the container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          tools/release.sh "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      - name: Test
        working-directory: host
        run: go test ./...

      - name: Build static Linux binaries
        working-directory: host
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist-host
          for arch in amd64 arm64; do
            # static, stripped, no build paths or build ID: reproducible
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -buildid=" \
              -o "../dist-host/passu-$VERSION-linux-$arch" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-host
          path: dist-host/
          if-no-files-found: error

  release:
    needs: [build, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dist-host
          path: dist

      - name: Checksums for all files
        run: |
          cd dist && sha256sum passu-* > SHA256SUMS && cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
          gh release create "$VERSION" --draft --verify-tag \
            --title "passu $VERSION" --notes-file notes.md dist/*
